spring.application.name=edusecurity-auth
server.port=8081

# Configuración centralizada (Config Server) - opcional
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Base de datos propia: database-per-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edusecurity_auth}
spring.datasource.username=${DB_USERNAME:auth_svc}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad
app.security.enabled=true
app.security.permit-all=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/password/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/error
app.security.internal-key=${INTERNAL_API_KEY}
app.security.allowed-origin-patterns=*

# JWT
app.jwt.secret=${JWT_SECRET}
# Vigencia corta: al cerrar sesión el access token deja de servir en pocos minutos (HU3).
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:15m}
app.jwt.refresh-expiration=7d

# Administrador inicial: sin ADMIN_PASSWORD no se crea (la contraseña nunca se registra en logs)
app.admin.correo=${ADMIN_CORREO:admin@edusecurity.com}
app.admin.password=${ADMIN_PASSWORD:}

# Reglas de acceso M01 (valores provisionales)
app.acceso.max-intentos-fallidos=${ACCESO_MAX_INTENTOS:5}
app.acceso.duracion-bloqueo=${ACCESO_DURACION_BLOQUEO:15m}
app.acceso.vigencia-recuperacion=${ACCESO_VIGENCIA_RECUPERACION:30m}
app.acceso.url-restablecer=${ACCESO_URL_RESTABLECER:http://localhost:5500/restablecer.html}
app.acceso.correo-remitente=${MAIL_FROM:no-reply@edusecurity.com}

# Correo (SMTP) para la recuperación de contraseña. Sin MAIL_HOST no se envían correos.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# OpenAPI
app.openapi.title=EduSecurity Auth Service
app.openapi.description=Autenticación (JWT), gestión de usuarios y roles de la plataforma EduSecurity.
app.openapi.version=1.0.0

# Descubrimiento de servicios
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator / salud
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

logging.level.org.springframework.security=WARN

# Cada línea de log lleva el id de correlación de la petición (X-Correlation-Id)
logging.pattern.level=%5p [%X{correlationId:-}]
