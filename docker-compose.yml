# ============================================================================
# EduSecurity Backend - Arquitectura de microservicios
#
# Uso:
#   0) cp .env.example .env   y reemplaza cada valor (ver instrucciones en el archivo)
#   1) mvnw clean package -DskipTests
#   2) docker compose up --build
#   3) Gateway: http://localhost:8080  |  Swagger: http://localhost:8080/swagger-ui.html
# ============================================================================

name: edusecurity-backend

services:

  # ------------------------------------------------------------- PostgreSQL
  # Una base por servicio, cada una con su propio rol (docker/postgres-init/01-databases.sh).
  postgres:
    image: postgres:16-alpine
    container_name: edusecurity-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH:?Define DB_PASSWORD_AUTH en .env}
      DB_PASSWORD_CONTENIDO: ${DB_PASSWORD_CONTENIDO:?Define DB_PASSWORD_CONTENIDO en .env}
      DB_PASSWORD_PROGRESO: ${DB_PASSWORD_PROGRESO:?Define DB_PASSWORD_PROGRESO en .env}
      DB_PASSWORD_SIMULACION: ${DB_PASSWORD_SIMULACION:?Define DB_PASSWORD_SIMULACION en .env}
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [edusecurity]

  # -------------------------------------------------------- Config Server
  config-server:
    build:
      context: ./config-server
    container_name: edusecurity-config-server
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [edusecurity]

  # --------------------------------------------------------- Eureka Server
  eureka-server:
    build:
      context: ./eureka-server
    container_name: edusecurity-eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [edusecurity]

  # ---------------------------------------------------------- Auth Service
  auth-service:
    build:
      context: ./auth-service
    container_name: edusecurity-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edusecurity_auth
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${DB_PASSWORD_AUTH:?Define DB_PASSWORD_AUTH en .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
      # Recuperación de contraseña: sin MAIL_HOST no se envían correos
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ACCESO_URL_RESTABLECER: ${ACCESO_URL_RESTABLECER:-http://localhost:5500/restablecer.html}
      # Administrador inicial: sin ADMIN_PASSWORD no se crea
      ADMIN_CORREO: ${ADMIN_CORREO:-admin@edusecurity.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # No se publica: solo accesible a través del gateway
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [edusecurity]

  # ------------------------------------------------------ Contenido Service
  contenido-service:
    build:
      context: ./contenido-service
    container_name: edusecurity-contenido-service
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edusecurity_contenido
      DB_USERNAME: contenido_svc
      DB_PASSWORD: ${DB_PASSWORD_CONTENIDO:?Define DB_PASSWORD_CONTENIDO en .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [edusecurity]

  # ------------------------------------------------------ Progreso Service
  progreso-service:
    build:
      context: ./progreso-service
    container_name: edusecurity-progreso-service
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      contenido-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edusecurity_progreso
      DB_USERNAME: progreso_svc
      DB_PASSWORD: ${DB_PASSWORD_PROGRESO:?Define DB_PASSWORD_PROGRESO en .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [edusecurity]

  # ----------------------------------------------------- Simulación Service
  simulacion-service:
    build:
      context: ./simulacion-service
    container_name: edusecurity-simulacion-service
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edusecurity_simulacion
      DB_USERNAME: simulacion_svc
      DB_PASSWORD: ${DB_PASSWORD_SIMULACION:?Define DB_PASSWORD_SIMULACION en .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [edusecurity]

  # ----------------------------------------------------------- API Gateway
  api-gateway:
    build:
      context: ./api-gateway
    container_name: edusecurity-api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      contenido-service:
        condition: service_healthy
      progreso-service:
        condition: service_healthy
      simulacion-service:
        condition: service_healthy
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5500,http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [edusecurity]

volumes:
  postgres_data:

# Red interna: los microservicios solo se comunican entre sí y a través del gateway
networks:
  edusecurity:
    driver: bridge
