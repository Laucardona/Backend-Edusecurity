# Actualizaciones automáticas de dependencias. Cada PR de Dependabot pasa por la CI como cualquier otro.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directories:
      - "/api-gateway"
      - "/auth-service"
      - "/config-server"
      - "/contenido-service"
      - "/eureka-server"
      - "/progreso-service"
      - "/simulacion-service"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
