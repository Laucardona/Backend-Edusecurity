spring.application.name=edusecurity-progreso
server.port=8083

# Configuración centralizada (Config Server) - opcional
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Base de datos propia: database-per-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edusecurity_progreso?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Feign (llamadas a auth-service y contenido-service)
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=false
spring.cloud.openfeign.compression.request.enabled=false

# Seguridad
app.security.enabled=true
app.security.permit-all=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/error
app.security.internal-key=${INTERNAL_API_KEY}
app.security.allowed-origin-patterns=*

# JWT (misma clave que el resto de servicios)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=10h
app.jwt.refresh-expiration=7d

# OpenAPI
app.openapi.title=EduSecurity Progreso Service
app.openapi.description=Seguimiento del progreso de los estudiantes y estadísticas de la plataforma.
app.openapi.version=1.0.0

# Descubrimiento de servicios
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator / salud
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.org.springframework.security=WARN
logging.level.edusecurity.progreso.client=DEBUG
