spring.application.name=edusecurity-simulacion
server.port=8084

# Configuración centralizada (Config Server) - opcional
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Base de datos propia: database-per-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edusecurity_simulacion}
spring.datasource.username=${DB_USERNAME:simulacion_svc}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad: todo requiere token; escritura solo ADMIN (en los controladores)
app.security.enabled=true
app.security.permit-all=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/error
app.security.internal-key=${INTERNAL_API_KEY}

# JWT (misma clave que el resto de servicios)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=10h
app.jwt.refresh-expiration=7d

# OpenAPI
app.openapi.title=EduSecurity Simulación Service
app.openapi.description=Laboratorios de phishing con bandeja simulada (HU43) y laboratorios guiados por pasos (HU44), con sesiones con tiempo y calificación. Envía los resultados a progreso-service (I7.4).
app.openapi.version=1.0.0

# Descubrimiento de servicios
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator / salud
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

logging.level.org.springframework.security=WARN

# Envío de resultados a progreso-service (I7.4): Feign por Eureka con la clave interna.
# Si progreso-service no responde, las sesiones se reenvían cada intervalo-ms en lotes.
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=false
app.progreso.reintento.intervalo-ms=${PROGRESO_REINTENTO_MS:60000}
app.progreso.reintento.retraso-inicial-ms=60000
app.progreso.reintento.lote=20

# Cada línea de log lleva el id de correlación de la petición (X-Correlation-Id)
logging.pattern.level=%5p [%X{correlationId:-}]
